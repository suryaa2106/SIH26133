<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedReach - AI Triage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container { max-width: 600px; margin: 50px auto; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .chat-header { background: #0d6efd; color: white; padding: 15px; text-align: center; }
        .chat-box { height: 400px; background: #fff; padding: 20px; overflow-y: auto; }
        .chat-input { display: flex; border-top: 1px solid #ddd; }
        .chat-input input { flex-grow: 1; border: none; padding: 15px; outline: none; }
        .chat-input button { border: none; background: #0d6efd; color: white; padding: 0 20px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 15px; display: flex; }
        .msg.bot .bubble { background: #e9ecef; border-radius: 15px 15px 15px 0; color: #333; }
        .msg.user { justify-content: flex-end; }
        .msg.user .bubble { background: #0d6efd; border-radius: 15px 15px 0 15px; color: white; }
        .bubble { padding: 10px 15px; max-width: 80%; }
        .triage-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; margin-top: 10px; display: inline-block; }
        .badge-red { background: #dc3545; color: white; }
        .badge-yellow { background: #ffc107; color: black; }
        .badge-green { background: #198754; color: white; }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <a href="/" class="btn btn-secondary mt-3">← Back to Home</a>
        <div class="chat-container">
            <div class="chat-header">
                <h5 class="mb-0">🤖 Triage Assistant</h5>
            </div>
            <div class="chat-box" id="chatbox">
                <div class="msg bot">
                    <div class="bubble">Namaste. I am the MedReach Triage AI. I understand English, Marathi (मराठी), and Hindi (हिंदी). Please describe your symptoms.</div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Try: 'mala tap ahe' or 'mujhe bukhar hai'..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if(!text) return;
            
            appendMsg("user", text);
            input.value = "";
            
            appendMsg("bot", "Analyzing symptoms...");

            const res = await fetch('/api/triage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symptoms: text })
            });
            const data = await res.json();
            
            // Remove "Analyzing..." bubble
            document.getElementById("chatbox").lastChild.remove();
            
            const triageClass = data.triage_level === 'RED' ? 'badge-red' : (data.triage_level === 'YELLOW' ? 'badge-yellow' : 'badge-green');
            const botHtml = `${data.recommendation} <br><span class="triage-badge ${triageClass}">Triage Level: ${data.triage_level}</span>`;
            
            appendHTML("bot", botHtml);
        }

        function appendMsg(sender, text) {
            const box = document.getElementById("chatbox");
            box.innerHTML += `<div class="msg ${sender}"><div class="bubble">${text}</div></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function appendHTML(sender, html) {
            const box = document.getElementById("chatbox");
            box.innerHTML += `<div class="msg ${sender}"><div class="bubble">${html}</div></div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
