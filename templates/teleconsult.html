<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedReach - Assisted Teleconsultation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1d20; color: white; }
        .video-container { background: #000; height: 500px; border-radius: 10px; display: flex; justify-content: center; align-items: center; position: relative; border: 2px solid #333;}
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; }
        .asha-cam { position: absolute; top: 10px; right: 10px; width: 150px; height: 100px; background: #222; border: 2px solid #0d6efd; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .vitals-panel { background: #2b3035; padding: 20px; border-radius: 10px; height: 100%; }
        .form-control { background: #1a1d20; color: white; border-color: #444; }
        .form-control:focus { background: #1a1d20; color: white; border-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container-fluid py-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><a href="/dashboard" class="text-white text-decoration-none">←</a> Live Teleconsultation</h4>
            <span class="badge bg-danger pulse">🔴 REC</span>
        </div>
        
        <div class="row">
            <!-- Video Section -->
            <div class="col-md-8">
                <div class="video-container">
                    <h5 class="text-muted">📷 Waiting for Patient Video...</h5>
                    
                    <!-- ASHA Worker Sub-camera -->
                    <div class="asha-cam">
                        <span>👩‍⚕️ ASHA Tai (Assisting)</span>
                    </div>

                    <div class="video-label">Patient: <strong>{{ patient }}</strong> (Connected via Sub-Centre Wadsa)</div>
                </div>
                <div class="mt-3 text-center">
                    <button class="btn btn-danger me-2">End Call</button>
                    <button class="btn btn-secondary me-2">Mute</button>
                    <button class="btn btn-primary" onclick="alert('Requesting ASHA worker to use digital stethoscope...')">Request Stethoscope Data</button>
                </div>
            </div>

            <!-- Vitals & Prescription Section (Assisted Mode) -->
            <div class="col-md-4">
                <div class="vitals-panel">
                    <h5 class="text-info border-bottom border-secondary pb-2">📋 Assisted Vitals Entry</h5>
                    <p class="small text-muted mb-4">Values updated live by ASHA worker on-ground.</p>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label text-muted small">Blood Pressure</label>
                            <input type="text" class="form-control" value="120/80" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small">SpO2 (%)</label>
                            <input type="text" class="form-control" value="98" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small">Temperature</label>
                            <input type="text" class="form-control" value="101.2 °F" readonly style="color: #ffc107;">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small">Weight (kg)</label>
                            <input type="text" class="form-control" value="65" readonly>
                        </div>
                    </div>

                    <h5 class="text-success border-bottom border-secondary pb-2 mt-4">💊 e-Prescription</h5>
                    <div class="mb-3">
                        <label class="form-label small">Diagnosis</label>
                        <input type="text" class="form-control" placeholder="e.g., Viral Fever">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Medicines</label>
                        <textarea class="form-control" rows="3" placeholder="Paracetamol 500mg, 1-0-1..."></textarea>
                    </div>
                    <button class="btn btn-success w-100" onclick="alert('Prescription sent digitally to PHC Pharmacy & ASHA Worker app.')">Send to Pharmacy</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
